; ============================================================================
; kayna-funkt Notmeldeterminal — multi-board project
;
; Each supported board gets its own [env:*] + its own src/<board>/main.cpp.
; Code shared across boards (currently: lage_db, the SQLite storage layer)
; lives in src/common/ and is pulled in via build_src_filter.
;
; Build/upload a specific board:
;   pio run -e seeed_xiao_esp32s3 -t upload
;   pio run -e sensecap_indicator -t upload
; ============================================================================

[platformio]
default_envs = seeed_xiao_esp32s3, sensecap_indicator

; ----------------------------------------------------------------------------
; Seeed XIAO ESP32-S3 (original board): talks to an external Meshtastic node
; (Seeed XIAO nRF52, stock Meshtastic firmware) over UART via D6/D7.
; No display — interaction is the serial CLI (see README "Serial-CLI").
; ----------------------------------------------------------------------------
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
    +<xiao/>
    +<common/>
build_flags =
    -D MT_DEBUGGING
    -I src/common
lib_deps =
    https://github.com/meshtastic/Meshtastic-arduino.git#6edd5643
    siara-cc/Sqlite3Esp32

; ----------------------------------------------------------------------------
; Seeed SenseCAP Indicator (D1L): ESP32-S3 + RP2040 dual-MCU, 480x480 RGB
; touchscreen (ST7701S) with capacitive touch (FT6336U). LoRa is the built-in
; SX1262 on the ESP32-S3 side, driven directly via RadioLib (see
; lora_radio.h/.cpp) with a real Meshtastic-protocol-compatible packet layer
; on top (see meshtastic_proto.h/.cpp) — vendored nanopb + Meshtastic's own
; generated protobuf headers in lib/meshtastic_proto/, see that folder's
; README for provenance. The external-node bridge (Weg 2, meshtastic_bridge.h)
; is kept in the tree but permanently unused: this board's RP2040 has no
; hardware path to the SX1262, and there's no free GPIO for a separate node.
;
; Confirmed-working, hardware-specific settings (found by trial and error
; against this exact unit, see git history for the bring-up story):
;   - flash_mode=dio, memory_type=dio_opi (octal PSRAM) — qio variants
;     bootloop instead of reaching setup().
;   - default_8MB.csv partition table — this unit's flash is 8MB
;     (confirmed via `esptool.py flash_id`), default_16MB.csv bootloops.
;   - Panel is mounted upside down — corrected in software, see
;     sensecap/main.cpp (lvgl_disp_flush) and sensecap/touch.cpp.
;
; Pin definitions and the ST7701 bring-up sequence are adapted from the
; community reference firmware (ril3y/sensecap-indicator-d1l on GitHub),
; cross-checked against Seeed's own SenseCAP_Indicator_ESP32 SDK repo.
;
; platform is pinned to 5.4.0 (ESP-IDF 4.x): Arduino_GFX's ESP32-S3 RGB
; panel driver is documented as incompatible with ESP-IDF 5.x toolchains.
; ----------------------------------------------------------------------------
[env:sensecap_indicator]
platform = espressif32@5.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
    +<sensecap/>
    +<common/>
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.partitions = default_8MB.csv
build_flags =
    ; Classic UART0 console (matches the CH340 bridge this board exposes),
    ; not native USB CDC — keeps the port we've verified with esptool.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    ; nanopb config matching Meshtastic firmware's own build exactly (see
    ; lib/meshtastic_proto/README.md) so the vendored generated headers behave
    ; identically to the real firmware.
    -DPB_ENABLE_MALLOC=1
    -DPB_VALIDATE_UTF8=1
    -I include
    -I src/common
lib_deps =
    moononournation/GFX Library for Arduino@1.3.8
    lvgl/lvgl@^8.3.11
    Wire
    siara-cc/Sqlite3Esp32
    jgromes/RadioLib@^6.6.0
    ; NOT Meshtastic-arduino here (unlike the xiao env): it bundles its own
    ; older nanopb + generated protobuf copy under the same file paths as
    ; lib/meshtastic_proto/, which collided with ours in PlatformIO's
    ; Library Dependency Finder (silently built the wrong/older one). This
    ; board doesn't need it anyway -- Weg 2 (that library's reason for
    ; being here) is permanently unused on this board, see meshtastic_proto.h.

; ----------------------------------------------------------------------------
; SenseCAP Indicator's OTHER onboard MCU: the RP2040 sensor co-processor.
; Not built/uploaded by default (not in default_envs) -- separate physical
; chip, separate flashing procedure (BOOTSEL button + UF2, not esptool), so
; it shouldn't surprise anyone running a plain `pio run`. Build/upload it
; explicitly:
;   pio run -e sensecap_rp2040 -t upload
;
; Why this exists: the SD card slot Seeed's own schematic and RP2040-dev
; docs document for this board is wired to the RP2040 (SPI1: SCK=GP10,
; MOSI=GP11, MISO=GP12, CS=GP13), NOT the ESP32-S3 -- there is no path to
; reach it from ESP32-S3 GPIOs at all, confirmed against Seeed's own
; "Dive into the Hardware" and "MicroSD" wiki pages. This firmware replaces
; the RP2040's stock sensor-telemetry firmware (never read by our ESP32
; code -- nothing lost) with one that mounts the SD card and appends
; whatever lines the ESP32-S3 sends it over the existing COBS/PacketSerial
; UART link (same protocol family Seeed's own stock firmware uses, own
; packet types -- see src/sensecap_rp2040/main.cpp). Write-only mirror: the
; SD card is a backup of what's already reliably stored in SPIFFS/SQLite on
; the ESP32-S3, not a replacement store (yet) -- see git history / the
; Testprotokoll discussion for why a full bidirectional SQLite-over-SD
; bridge was deliberately not the first step.
; ----------------------------------------------------------------------------
[env:sensecap_rp2040]
; PlatformIO's official "raspberrypi" platform ships the mbed-based Arduino
; core, which does NOT have the flexible pin-remapping API (Serial1.setTX/
; setRX, a separate SPI1 object) that both Seeed's own RP2040 tutorials and
; this firmware's pin assignment rely on -- found live 2026-09-21 (build
; error: "class arduino::UART has no member named setTX"). Earlephilhower's
; well-established third-party "arduino-pico" core has that API and is what
; Seeed's example code (and most of the RP2040 Arduino ecosystem) actually
; targets; this community-maintained PlatformIO platform fork provides it.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<sensecap_rp2040/>
build_flags =
    -I src/common
; No lib_deps: SDFS (see src/sensecap_rp2040/main.cpp for why SDFS and not
; the classic "SD" library) ships as part of arduino-pico itself, not a
; separate library. COBS framing is hand-rolled (src/common/cobs.h)
; instead of pulling in the PacketSerial library Seeed's own docs mention
; -- avoids depending on an external library's exact Stream/callback API
; version for ~30 lines of well-understood algorithm, and lets the exact
; same header be shared by both the RP2040 and ESP32-S3 sides of the link.
